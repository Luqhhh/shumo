[decisions.D_RESAMPLE]
status = "approved"
choice = """
D_RESAMPLE只负责接收已经由 forecast-combination 层合成的唯一小时预测序列，
不负责选择 forecast vintage、计算 VERSION-B + WEIGHT-B 权重或处理 epsilon。
以最近已结束十分钟实际 PV 区间均值作为当前决策边界的左端点代理；
对 slot_end=t+10min ... t+24h 的十分钟右端点生成 RESAMPLE-LIN 主方案，
并以 RESAMPLE-PCHIP 作为敏感性对照。整点必须精确命中已组合的小时预测值，
跨午夜按真实 valid_time 连续，功率到区间电量统一使用
power_kw * (1/6 h)。不得把点值插值改写为小时平均功率的区间重叠拆分。
"""
rationale = "C-4真实数据审计支持整点功率点值语义；线性插值边界清晰，PCHIP用于敏感性检验。版本组合、权重和epsilon属于独立的forecast-combination层。"
confirmed_by = "lqh、xjn、jjt"
confirmed_at = "2026-09-11T19:27:00+08:00"
source = "C-4 decision card；证据提交0b06e37；批准记录提交9f8f323f0dd28acd7619715faba5319ca80d169a；三位队员于 2026-09-11 19:27（北京时间）确认"

[decisions.D_SETTLE]
status = "approved"
choice = """
采用 docs/q3_model.md 的 SETTLE-A-v2：00:00 合同为版本0；正常费用为
sum(q_plan[k]*p_base[k])，未利用合同电仍付费，无退款或售电收入。
每次允许的调整相对上一版确认量：delta_plus=max(q_new-q_prev,0)，
delta_minus=max(q_prev-q_new,0)，q_new=q_prev+delta_plus-delta_minus>=0。
调整费用逐版累加 p_trade[v]*(1.5*delta_plus+0.5*delta_minus)，
不抵销中间交易，不把最终合同量再次全额计为正常计划费。
紧急电量是执行区间实际供需的剩余缺口，费用为5*p_exec[k]*q_emergency[k]；
不得同时紧急购电和充电或弃电。实际PV分为PV_use和S_PV，合同余电为S_grid；
q_final+PV_use+D+q_emergency=Load+C+S_grid，PV_actual=PV_use+S_PV。
Q2无调整权；Q3仅在00/06/12/18发布后调整当日尚未开始的时隙；
已执行时隙冻结，上一版已确认的未来量在允许发布时刻仍可调整。
Q2/Q3的p_base及p_exec使用执行区间固定电价，Q3的p_trade使用发布时刻
所在区间固定电价，均按附件1右端点标签映射到区间，禁止错移一格。
Q4结算对应使用附件4执行区间/交易时刻实际价格，其预测信息和模型仍单独审批。
正式总费用=planned_cost+adjustment_cost+emergency_cost，以实际回放账本计算。
SETTLE-B仅作最终版相对版本0的一次调整敏感性对照。
"""
rationale = "A在本会话明确批准D_SETTLE；采用已有SETTLE-A-v2提案，统一版本等式、可调整未来合同和不重复扣除弃光的物理账本；额外结算解释属于建模假设。"
confirmed_by = "A（本会话用户）"
confirmed_at = "2026-09-12"
source = "2026-09-12本会话用户批准消息；docs/q3_model.md；C-3 decision card；B分支b4113b0的SETTLE-A-v2提案"

[decisions.D_LOAD_FORECAST]
status = "approved"
choice = """
Q3采用LOAD-A + LF-A。目标时刻前7/14/21/28天同slot负载按
(8/15,4/15,2/15,1/15)加权；历史残差e[s]=load[s]-base[s]，
从最长非零滞后开始，以截至decision_time的扩展残差做无截距AR(1)：
phi=clip(sum(e[s-1]*e[s])/sum(e[s-1]^2),0,0.999)，分母为0时phi=0；
forecast(t+h)=max(0,base(t+h)+phi^h*e[t])，h为十分钟步数。
00/06/12/18使用available_at<=decision_time的历史更新，每版独立留存；
每个发布时间一次性冻结未来30小时（180个十分钟点）的不可变版本；中间10分钟MPC
只从最近一次已发布版本切取未来24小时（144点），不重新预测。30小时仅用于覆盖
两个发布时间之间最多5小时50分钟的窗口尾部，不改变Q2预测机制或Q3发布时间。
一月仅作历史初始化，二月起运行；缺少所需周滞后或残差时显式报错，不填未来actual。
保留半周半衰期和LF-B（当日00:00版不更新）敏感性。
记录decision_time/valid_time/available_at/training_cutoff/lag_values/lag_weights/
ar1_phi/latest_visible_residual/model_version/data_version/prediction_value。
日内更新是MODELING_ASSUMPTION，算法和半衰期是EMPIRICAL_CHOICE；
本次批准范围为Q3，不据此批准Q2或Q4的预测模型。
"""
rationale = "A明确正式确认LOAD-A + LF-A，并于2026-09-13单独确认C-7 LOAD-HORIZON-A；30小时版本保证任意两次发布时间之间的10分钟MPC仍有完整24小时负载窗口，且不引入中间重预测。官方附件2复算48096个共同目标，MAE为163.9090 kW，对比7天基线175.3080 kW和LF-B 166.9809 kW；不宣称参数唯一最优。"
confirmed_by = "A（队长，经C成员本会话转述）"
confirmed_at = "2026-09-13"
source = "2026-09-12 LOAD-A/LF-A确认与2026-09-13 C-7确认（均经C成员本会话转述）；docs/c_load_forecast_evidence.md；C-1/C-5/C-7；审阅提交7b90599"

[decisions.D_PV_TAIL_BASELINE]
status = "approved"
choice = """
采用TAIL-EXP2作为Q3 HORIZON-B的严格因果PV尾部基线：对每个附件3快照覆盖末端之后、
且位于decision_time后24小时内的十分钟右端点，读取前1至7天相同slot的实际PV；
raw_weight[d]=2^(-(d-1)/2)，d=1,...,7，再归一化后加权求和，半衰期固定为2天。
training_cutoff=decision_time，任一所需滞后缺失时显式失败；不得读取未来actual，
不得覆盖附件3仍覆盖的slot，不做AR修正或静默切换算法。每点保留7条source_refs、
model_version=TAIL-EXP2/v1和fallback_reason=attachment3_horizon_exhausted。
该算法和2天半衰期标记为EMPIRICAL_CHOICE；TAIL-MEAN7保留为sensitivity。
"""
rationale = "六个固定候选在2025-02-01至2026-01-01（不含）共同的839160个调用加权样本上比较；TAIL-EXP2的MAE/RMSE为150.0197/300.8667 kW，优于TAIL-MEAN7的153.8800/304.0084 kW；实际PV>0的470109个样本和9–12月诊断中排名一致，但不宣称具有普适最优性。"
