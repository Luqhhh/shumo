# ===== B 侧滚动优化与价格预测草案：仅供团队讨论 =====
[decisions.D_MPC]
status = "proposed"
choice = """
Q2/Q3/Q4采用连续SOC的24小时滚动模型预测控制，优化每10分钟更新，
但只执行当前第一个十分钟电池动作。电池内部动作更新频率与Q3合同购电
调整频率严格区分：合同购电只能在00:00、06:00、12:00、18:00调整。
已执行或已提交的合同购电时隙通过 commitment ledger 冻结，不得被后续MPC
静默改写；只有规则允许的未冻结时隙可以重算。48小时窗口仅作敏感性实验。
"""
rationale = "将储能物理控制频率与市场合同调整时刻分离，避免滚动优化误改已提交承诺。"
confirmed_by = ""
confirmed_at = ""
source = "团队讨论；C题合同调整时刻；Q2-Q3-Q4 Rolling Optimization Core Execution Brief"

[decisions.D_TERMINAL]
status = "proposed"
choice = """
除年度最终阶段外，24小时滚动窗口采用线性储能经济价值终端项：
-v_t * E_(t+H)，不采用每日末SOC回到6000 kWh的二次惩罚。

v_t = eta_d * mean(marginal_normal_purchase_price_forecast[t+H+1:t+H+144])。

Q2/Q3使用已知固定电价计算；Q4使用严格因果的未来波动电价预测计算。
正式敏感性实验比较0.8v、v、1.2v。

当2025年度最终时点进入当前优化窗口时，移除终端经济价值项，
改用年度最终SOC硬约束；不得同时使用年度末硬约束和年度末残值。
"""
rationale = "缓解有限滚动窗口的短视放电，同时避免与年度末SOC硬约束重复计价。"
confirmed_by = ""
confirmed_at = ""
source = "团队讨论；Q2-Q3-Q4 Rolling Optimization Core Execution Brief"

