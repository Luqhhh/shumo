# ===== B 侧滚动优化与价格预测草案：仅供团队讨论 =====
[decisions.D_MPC]
status = "proposed"
choice = """
Q2/Q3/Q4采用连续SOC的滚动模型预测控制。优化窗口固定为24小时，
即144个十分钟slot；每10分钟重新求解一次，每次只执行第一个slot动作，
其余未来动作在下一时刻全部重算。

滚动重优化不改变市场承诺：已经提交、冻结或题面不允许修改的计划购电/
调整购电变量必须通过 commitment ledger 固定；只有规则允许修改的变量
可重新决策。48小时窗口仅用于敏感性实验，不作为正式基线模型。
"""
rationale = "避免每天重置储能，且使实时控制只基于当时可见的信息。"
confirmed_by = ""
confirmed_at = ""
source = "团队讨论；Q2-Q3-Q4 Rolling Optimization Core Execution Brief"

[decisions.D_TERMINAL]
status = "proposed"
choice = """
除年度最终阶段外，24小时滚动窗口采用线性储能经济价值终端项：
-v_t * E_(t+H)，不采用每日末SOC回到6000 kWh的二次惩罚。

v_t = eta_d * mean(marginal_normal_purchase_price_forecast[t+H+1:t+H+144])。

Q2/Q3使用已知固定电价计算；Q4使用严格因果的未来波动电价预测计算。
正式敏感性实验比较0.8v、v、1.2v。

当2025年度最终时点进入当前优化窗口时，移除终端经济价值项，
改用年度最终SOC硬约束；不得同时使用年度末硬约束和年度末残值。
"""
rationale = "缓解有限滚动窗口的短视放电，同时避免与年度末SOC硬约束重复计价。"
confirmed_by = ""
confirmed_at = ""
source = "团队讨论；Q2-Q3-Q4 Rolling Optimization Core Execution Brief"

[decisions.D_YEAR_BOUNDARY]
status = "proposed"
choice = """
本项补充既有 D_STATE：Q2/Q3/Q4 在正式运行期内SOC连续传递，
不按日重置；年度最终时点施加 E_2025_end = 6000 kWh 硬约束，
且该硬约束只作用于全年最终时点，不作用于每日末时点。

Q1继续单独采用 E_24 = E_0。年度终点尚未进入当前MPC窗口时，
是否增加终点可达性约束，须以储能充放电功率、剩余slot以及弃光/
外购电规则为依据另行明确。
"""
rationale = "保证跨日储能物理连续性，并使不同模型的年度比较具备相同终端状态。"
confirmed_by = ""
confirmed_at = ""
source = "团队讨论；D_STATE 已批准口径；Q2-Q3-Q4 Rolling Optimization Core Execution Brief"

[decisions.D_PRICE_FORECAST]
status = "proposed"
choice = """
Q4未来波动电价采用严格因果的周周期组合加残差AR(1)预测。
基础预测使用过去7、14、21、28天相同slot历史价格的非负、和为1的加权组合；
权重仅利用 decision_time 之前的历史数据估计。最新可见残差采用AR(1)衰减修正。
价格预测不强制截断为非负。

Q4每次控制需要未来24小时优化价格预测，并额外预测后续24小时，
用于计算 D_TERMINAL 的终端SOC经济价值。
"""
rationale = "保证Q4未来价格预测严格因果，并为24小时MPC终端项提供价格依据。"
