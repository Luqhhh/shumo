[decisions.D_LOAD_FORECAST]
status = "approved"
choice = """
Q3采用LOAD-A + LF-A。目标时刻前7/14/21/28天同slot负载按
(8/15,4/15,2/15,1/15)加权；历史残差e[s]=load[s]-base[s]，
从最长非零滞后开始，以截至decision_time的扩展残差做无截距AR(1)：
phi=clip(sum(e[s-1]*e[s])/sum(e[s-1]^2),0,0.999)，分母为0时phi=0；
forecast(t+h)=max(0,base(t+h)+phi^h*e[t])，h为十分钟步数。
00/06/12/18使用available_at<=decision_time的历史更新，每版独立留存；
一月仅作历史初始化，二月起运行；缺少所需周滞后或残差时显式报错，不填未来actual。
保留半周半衰期和LF-B（当日00:00版不更新）敏感性。
记录decision_time/valid_time/available_at/training_cutoff/lag_values/lag_weights/
ar1_phi/latest_visible_residual/model_version/data_version/prediction_value。
日内更新是MODELING_ASSUMPTION，算法和半衰期是EMPIRICAL_CHOICE；
本次批准范围为Q3，不据此批准Q2或Q4的预测模型。
