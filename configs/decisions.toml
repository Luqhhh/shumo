[decisions.D_EFF]
status = "approved"
choice = "eta_c=eta_d=0.9；E_{k+1}=E_k+0.9*c_k-d_k/0.9。c_k/d_k 定义在母线侧且非负；5000 kW 也按母线侧解释，故单区间约束 0<=c_k,d_k<=5000*(1/6) kWh。不同时充放电；不允许事后 clip 越界。"
rationale = "题面只给充放电效率 90%；本条明确各方向 0.9、母线侧行动量、电池内部储能，往返效率因此为 81%；2026-09-10 用户明确批准。"
confirmed_by = "参赛队（用户批准）"
confirmed_at = "2026-09-10"
