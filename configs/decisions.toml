[decisions.D_SETTLE]
status = "approved"
choice = """
采用 docs/q3_model.md 的 SETTLE-A-v2：00:00 合同为版本0；正常费用为
sum(q_plan[k]*p_base[k])，未利用合同电仍付费，无退款或售电收入。
每次允许的调整相对上一版确认量：delta_plus=max(q_new-q_prev,0)，
delta_minus=max(q_prev-q_new,0)，q_new=q_prev+delta_plus-delta_minus>=0。
调整费用逐版累加 p_trade[v]*(1.5*delta_plus+0.5*delta_minus)，
不抵销中间交易，不把最终合同量再次全额计为正常计划费。
紧急电量是执行区间实际供需的剩余缺口，费用为5*p_exec[k]*q_emergency[k]；
不得同时紧急购电和充电或弃电。实际PV分为PV_use和S_PV，合同余电为S_grid；
q_final+PV_use+D+q_emergency=Load+C+S_grid，PV_actual=PV_use+S_PV。
Q2无调整权；Q3仅在00/06/12/18发布后调整当日尚未开始的时隙；
已执行时隙冻结，上一版已确认的未来量在允许发布时刻仍可调整。
Q2/Q3的p_base及p_exec使用执行区间固定电价，Q3的p_trade使用发布时刻
所在区间固定电价，均按附件1右端点标签映射到区间，禁止错移一格。
Q4结算对应使用附件4执行区间/交易时刻实际价格，其预测信息和模型仍单独审批。
正式总费用=planned_cost+adjustment_cost+emergency_cost，以实际回放账本计算。
SETTLE-B仅作最终版相对版本0的一次调整敏感性对照。
