[decisions.D_MODEL_Q3]
status = "proposed"
choice = """
Q3采用严格因果的24小时滚动MILP，沿用连续SOC、D_MPC和年度边界。
预测时先构造 InfoSet：保留所有 available_at <= decision_time 的附件3版本；
对同一 valid_time 的可见版本，不简单选择最新一版，而按 lead_hours 使用
历史MAE平方倒数加权（VERSION-B + WEIGHT-B）。每个权重只能由该预测版本
发布前已可获得的历史actual估计；主方案采用HISTORY-A扩展历史，
HISTORY-C-56（过去56日）作敏感性对照。实际数据表明附件3预测误差随提前量
显著增加，lead 1/24小时MAE约为18.69/374.79 kW，支持lead-specific权重，
但加权结果须在完整回测中同时报告MAE和RMSE，不预设必然改善。

负载采用LF-A：00:00、06:00、12:00、18:00可用当时已观测actual对剩余负载
预测做因果更新；每版保存training_cutoff并禁止未来泄漏，LF-B作为敏感性对照。
附件3光伏采用D_RESAMPLE的RESAMPLE-LIN主方案，PCHIP作敏感性。Q3合同购电
