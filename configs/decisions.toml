[decisions.D_LOAD_FORECAST]
status = "proposed"
choice = """
采用 LF-A 作为 Q3 负载预测主方案：每天 00:00、06:00、12:00、18:00
均可使用该决策时刻之前已观测的负载，对尚未开始的剩余时隙进行因果校正；
不得使用决策时刻之后的 actual。每一版预测必须保存
valid_time、available_at、training_cutoff、model_version、data_version。
LF-B（仅 00:00 生成、日内不更新）作为敏感性对照；日内更新属于
MODELING_ASSUMPTION，不得写成题面明文条件。
"""
rationale = "真实附件2上，28日同一时段均值代理的严格因果回测（191592个有效十分钟点）中，LF-A的MAE/RMSE为784.54/965.65，LF-B为787.73/969.77；收益较小但方向一致，因此主方案保留LF-A并保留LF-B对照。"
confirmed_by = ""
