[decisions.D_RESAMPLE]
status = "proposed"
choice = """
仅在附件3预测量确认代表区间平均功率时，转为10分钟网格采用基于时间区间
重叠长度的能量守恒重采样；不得普通线性插值。每个10分钟slot的能量等于
所有相交原区间 power_kw * overlap_hours 的和，再乘6恢复等效平均功率。
必须验证重采样前后总能量守恒。
"""
rationale = "避免小时预测转10分钟时改变总发电能量。"
confirmed_by = ""
confirmed_at = ""
