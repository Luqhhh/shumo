name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.6"
          enable-cache: true

      - name: Lockfile check
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format check
        run: uv run --locked ruff format --check .

      - name: Pytest (includes decision/release guard tests)
        run: uv run --locked pytest -q

      - name: Synthetic smoke
        run: uv run --locked python -m microgrid smoke

  paper:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.6"
          enable-cache: true

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk biber \
            texlive-xetex texlive-lang-chinese texlive-latex-extra \
            texlive-bibtex-extra texlive-fonts-recommended

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Build paper draft
        run: uv run --locked python scripts/build_paper.py --mode draft

      - name: Build AI details draft
        run: uv run --locked python scripts/build_paper.py --target ai-details --mode draft
